apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: slop-detector-gateway
  namespace: default
  labels:
    app: slop-detector
spec:
  selector:
    istio: aks-istio-ingressgateway-external
  servers:
    # HTTP server (can redirect to HTTPS if needed)
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "slop.cat-herding.net"
      # Optional: Uncomment to redirect HTTP to HTTPS
      # tls:
      #   httpsRedirect: true
    
    # HTTPS server
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "slop.cat-herding.net"
      tls:
        mode: SIMPLE
        credentialName: slop-tls
