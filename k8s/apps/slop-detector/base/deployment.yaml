apiVersion: apps/v1
kind: Deployment
metadata:
  name: slop-detector
  labels:
    app: slop-detector
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: slop-detector
  template:
    metadata:
      labels:
        app: slop-detector
        version: v1
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: slop-detector
          image: gabby.azurecr.io/slop-detector:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: ENVIRONMENT
              value: "k8s"
            # Optional: AI provider API keys (use secrets in production)
            # - name: OPENAI_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: slop-detector-secrets
            #       key: openai-api-key
            # - name: ANTHROPIC_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: slop-detector-secrets
            #       key: anthropic-api-key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
