apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: slop-detector-secrets-provider
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: ""  # Set this to your managed identity client ID
    keyvaultName: ""  # Set this to your Key Vault name
    cloudName: ""
    objects: |
      array:
        - |
          objectName: slop-detector-client-secret
          objectType: secret
          objectVersion: ""
        - |
          objectName: slop-detector-oauth-hmac-secret
          objectType: secret
          objectVersion: ""
    tenantId: ""  # Set this to your Azure tenant ID
